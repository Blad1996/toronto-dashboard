<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Toronto Leads Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/main.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

    .reset-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 48px 44px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1), 0 0 0 1px rgba(0,0,0,0.04);
      text-align: center;
      animation: slideUp 0.4s ease-out;
    }

    .reset-logo {
      font-size: 52px;
      margin-bottom: 20px;
      display: block;
    }

    .reset-card h2 {
      font-size: 26px;
      font-weight: 800;
      color: #1a202c;
      letter-spacing: -0.4px;
      margin-bottom: 8px;
    }

    .reset-card > p {
      color: #718096;
      font-size: 15px;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .strength-bar {
      height: 4px;
      border-radius: 4px;
      background: #e5e7eb;
      margin-top: 8px;
      overflow: hidden;
    }

    .strength-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s, background 0.3s;
      width: 0%;
    }

    .strength-label {
      font-size: 12px;
      margin-top: 4px;
      text-align: right;
      font-weight: 500;
    }

    .invalid-state {
      padding: 24px 0;
    }

    .invalid-state p {
      color: #b91c1c;
      font-size: 15px;
      margin-bottom: 20px;
    }

    .btn-back {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      transition: opacity 0.2s;
    }

    .btn-back:hover { opacity: 0.9; }

    .success-message a {
      color: #15803d;
      font-weight: 600;
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .reset-card { padding: 36px 24px; }
    }
  </style>
</head>
<body>

  <div class="reset-card">
    <span class="reset-logo">🎯</span>

    <!-- State: loading (default) -->
    <div id="stateLoading">
      <h2>Verifying link…</h2>
      <p>Please wait a moment.</p>
      <div class="spinner" style="margin: 20px auto 0;"></div>
    </div>

    <!-- State: invalid / expired link -->
    <div id="stateInvalid" style="display:none;">
      <h2>Link expired</h2>
      <div class="invalid-state">
        <p>This reset link is invalid or has already been used. Please request a new one.</p>
        <a href="index.html" class="btn-back">← Back to Login</a>
      </div>
    </div>

    <!-- State: reset form -->
    <div id="stateForm" style="display:none;">
      <h2>Set new password</h2>
      <p>Choose a strong password for your account.</p>

      <div id="resetError"   class="error-message"   style="display:none;"></div>
      <div id="resetSuccess" class="success-message" style="display:none;"></div>

      <form id="resetForm" style="text-align:left;">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔑</span>
            <input type="password" id="newPassword" required placeholder="Min. 8 characters" minlength="8">
          </div>
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <div class="strength-label" id="strengthLabel" style="color:#9ca3af;">—</div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔑</span>
            <input type="password" id="confirmPassword" required placeholder="Repeat your password">
          </div>
        </div>

        <button type="submit" class="btn-login" id="resetBtn">
          <span id="resetBtnText">Update Password</span>
          <span class="btn-login__spinner" style="display:none;"></span>
        </button>
      </form>
    </div>

  </div>

  <script src="js/config.js"></script>
  <script>
    // ---- Password strength meter ----
    document.getElementById('newPassword').addEventListener('input', function () {
      const val    = this.value;
      const fill   = document.getElementById('strengthFill');
      const label  = document.getElementById('strengthLabel');

      let score = 0;
      if (val.length >= 8)               score++;
      if (/[A-Z]/.test(val))             score++;
      if (/[0-9]/.test(val))             score++;
      if (/[^A-Za-z0-9]/.test(val))      score++;

      const levels = [
        { color: '#ef4444', text: 'Weak',      width: '25%' },
        { color: '#f97316', text: 'Fair',      width: '50%' },
        { color: '#eab308', text: 'Good',      width: '75%' },
        { color: '#22c55e', text: 'Strong',    width: '100%' },
      ];

      if (val.length === 0) {
        fill.style.width      = '0%';
        label.textContent     = '—';
        label.style.color     = '#9ca3af';
      } else {
        const level           = levels[Math.max(0, score - 1)];
        fill.style.width      = level.width;
        fill.style.background = level.color;
        label.textContent     = level.text;
        label.style.color     = level.color;
      }
    });

    // ---- Detect recovery session from Supabase ----
    supabaseClient.auth.onAuthStateChange(async (event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        document.getElementById('stateLoading').style.display = 'none';
        document.getElementById('stateForm').style.display    = 'block';
        document.getElementById('newPassword').focus();
      }
    });

    // Fallback: if no event fires after 4s, link is invalid
    setTimeout(() => {
      if (document.getElementById('stateLoading').style.display !== 'none') {
        document.getElementById('stateLoading').style.display = 'none';
        document.getElementById('stateInvalid').style.display = 'block';
      }
    }, 4000);

    // ---- Submit new password ----
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const newPassword     = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorDiv        = document.getElementById('resetError');
      const successDiv      = document.getElementById('resetSuccess');
      const btn             = document.getElementById('resetBtn');
      const btnText         = document.getElementById('resetBtnText');
      const spinner         = btn.querySelector('.btn-login__spinner');

      errorDiv.style.display = 'none';

      if (newPassword !== confirmPassword) {
        errorDiv.textContent   = 'Passwords do not match.';
        errorDiv.style.display = 'flex';
        document.getElementById('confirmPassword').focus();
        return;
      }

      if (newPassword.length < 8) {
        errorDiv.textContent   = 'Password must be at least 8 characters.';
        errorDiv.style.display = 'flex';
        return;
      }

      btn.disabled          = true;
      btnText.textContent   = 'Updating…';
      spinner.style.display = 'block';

      try {
        const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
        if (error) throw error;

        document.getElementById('resetForm').style.display = 'none';
        successDiv.innerHTML   = '✓ Password updated! <a href="index.html">Sign in →</a>';
        successDiv.style.display = 'flex';
      } catch (err) {
        errorDiv.textContent   = err.message || 'Failed to update password. Please try again.';
        errorDiv.style.display = 'flex';
      } finally {
        btn.disabled          = false;
        btnText.textContent   = 'Update Password';
        spinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
